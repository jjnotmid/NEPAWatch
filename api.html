<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEPAWatch API — Coming Soon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700;12..96,800&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #07090A;
      --surface: #111815;
      --green: #AAFF00;
      --border: rgba(255,255,255,.08);
      --ink: #F0F4EF;
      --ink2: rgba(240,244,239,.55);
      --ink3: rgba(240,244,239,.35);
    }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .logo {
      font-family: 'Bricolage Grotesque', sans-serif;
      font-size: .8rem;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--green);
      margin-bottom: 40px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .logo-dot {
      width: 8px; height: 8px;
      background: var(--green);
      border-radius: 50%;
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: .4; transform: scale(.7); }
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(170,255,0,.08);
      border: 1px solid rgba(170,255,0,.2);
      border-radius: 99px;
      padding: 6px 14px;
      font-size: .75rem;
      font-weight: 600;
      color: var(--green);
      letter-spacing: .04em;
      margin-bottom: 28px;
    }
    h1 {
      font-family: 'Bricolage Grotesque', sans-serif;
      font-size: clamp(2rem, 5vw, 3.2rem);
      font-weight: 800;
      line-height: 1.1;
      margin-bottom: 18px;
      letter-spacing: -.01em;
    }
    h1 span { color: var(--green); }
    p {
      font-size: 1rem;
      color: var(--ink2);
      max-width: 440px;
      line-height: 1.65;
      margin-bottom: 36px;
    }
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: var(--ink2);
      font-size: .85rem;
      text-decoration: none;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 20px;
      transition: color .15s, border-color .15s;
    }
    .back-link:hover { color: var(--ink); border-color: rgba(255,255,255,.18); }
    .footer {
      position: fixed;
      bottom: 24px;
      font-size: .75rem;
      color: var(--ink3);
    }
  </style>
</head>
<body>
  <div class="logo">
    <span class="logo-dot"></span>
    NEPAWatch
  </div>

  <div class="badge">
    <svg width="10" height="10" viewBox="0 0 10 10" fill="none"><circle cx="5" cy="5" r="4" stroke="currentColor" stroke-width="1.2"/><path d="M5 3v2.5l1.5 1" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
    Under Maintenance
  </div>

  <h1>API docs<br>coming <span>soon.</span></h1>
  <p>We're putting the finishing touches on the NEPAWatch developer API. Check back shortly — or head back to the app.</p>

  <a href="index.html" class="back-link">
    <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M8.5 3L4 7l4.5 4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    Back to NEPAWatch
  </a>

  <div class="footer">© 2026 NEPAWatch</div>
</body>
</html>
